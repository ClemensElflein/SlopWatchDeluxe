services:
  agentwatch:
    build: .
    restart: unless-stopped
    ports:
      - "${AGENTWATCH_PORT:-8765}:8765"
    environment:
      AGENTWATCH_PORT: 8765
      AGENTWATCH_DATABASE: /data/agentwatch.db
      AGENTWATCH_ARCHIVE_AFTER_HOURS: ${AGENTWATCH_ARCHIVE_AFTER_HOURS:-24}
      AGENTWATCH_API_TOKEN: ${AGENTWATCH_API_TOKEN:-}
    volumes:
      - agentwatch-data:/data
    init: true
    stop_grace_period: 5s

volumes:
  agentwatch-data:
